name: Windows preparation tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse all PowerShell files
        shell: pwsh
        run: ./tests/Parse-All.ps1
      - name: Portable behavior and process tests
        shell: pwsh
        run: ./tests/Run.Tests.ps1
      - name: Pinned C++ console through real Windows pipes
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          python tests\ConsoleProbe.py
